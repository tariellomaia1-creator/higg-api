name: Daily content scheduler

# Runs one scheduler pass on demand (Actions → Run workflow). Generation and
# posting are started by hand from the planner, so there is no schedule. To
# automate again, add `schedule: - cron: "*/10 * * * *"` and set the
# auto_generate setting to "on". All the logic lives in /api/cron/tick.
on:
  workflow_dispatch:

concurrency:
  group: daily-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Call scheduler
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Set SITE_URL and CRON_SECRET in Settings → Secrets and variables → Actions."
            exit 1
          fi
          curl --fail-with-body -sS --max-time 320 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${SITE_URL%/}/api/cron/tick"
