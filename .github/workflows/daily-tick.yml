name: Daily content scheduler

# Every 10 minutes: finish running generations, start today's slots from
# 06:00 Tbilisi, and publish one post per hour from 08:00. All the logic lives
# in the site's /api/cron/tick route; this job only calls it.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: daily-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Call scheduler
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Set SITE_URL and CRON_SECRET in Settings → Secrets and variables → Actions."
            exit 1
          fi
          curl --fail-with-body -sS --max-time 320 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${SITE_URL%/}/api/cron/tick"
